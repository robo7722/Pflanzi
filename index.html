}

function drawPipeAndPip(t){
  const {cell,ox,oy,fw,fh,vw,vh,safeB}=lay;
  const fb=oy+fh;
  const dcx=ox+(L.drainX+L.drainW/2)*cell;
  const flowing=S.tick-S.lastDrain<25;
  const p=Math.min(1,S.drained/L.required);
  const potBottom=vh-safeB-6, PS=0.8;
  const potH=36, potTop=potBottom-potH;
  let potX=dcx<vw/2?dcx+60:dcx-60;
  potX=Math.max(42,Math.min(vw-42,potX));
  const pipeY=potBottom-10, pw=11;
  ctx.lineJoin='round'; ctx.lineCap='round';
  // pipe
  ctx.strokeStyle=INKC; ctx.lineWidth=pw+7;
  ctx.beginPath(); ctx.moveTo(dcx,fb+4); ctx.lineTo(dcx,pipeY); ctx.lineTo(potX,pipeY); ctx.stroke();
  ctx.strokeStyle='#9aa3b3'; ctx.lineWidth=pw;
  ctx.beginPath(); ctx.moveTo(dcx,fb+4); ctx.lineTo(dcx,pipeY); ctx.lineTo(potX,pipeY); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(dcx-3,fb+8); ctx.lineTo(dcx-3,pipeY-3); ctx.lineTo(potX,pipeY-3); ctx.stroke();
  if(flowing){
    ctx.strokeStyle='#3fb6ff'; ctx.lineWidth=pw-6; ctx.setLineDash([6,9]); ctx.lineDashOffset=-t*0.06;
    ctx.beginPath(); ctx.moveTo(dcx,fb+6); ctx.lineTo(dcx,pipeY); ctx.lineTo(potX,pipeY); ctx.stroke();
    ctx.setLineDash([]);
  }
  // funnel + grate
  ctx.beginPath(); ctx.moveTo(dcx-L.drainW*cell/2-4,fb-cell); ctx.lineTo(dcx+L.drainW*cell/2+4,fb-cell);
  ctx.lineTo(dcx+pw/2+3,fb+10); ctx.lineTo(dcx-pw/2-3,fb+10); ctx.closePath(); inkFill('#9aa3b3',2.5);
  ctx.fillStyle='#2a2f38'; ctx.fillRect(ox+L.drainX*cell,fb-cell,L.drainW*cell,cell);
  ctx.fillStyle='#c4cad4';
  for(let k=1;k<L.drainW;k++) ctx.fillRect(ox+(L.drainX+k)*cell-1,fb-cell,2,cell);
  // plant (scaled to fit the slim bottom strip)
  ctx.save(); ctx.translate(potX,potBottom); ctx.scale(PS,PS); ctx.translate(-potX,-potBottom);
  const sway=Math.sin(t*0.002)*3;
  const maxStem=Math.max(16,(potBottom-fb)/PS-potH-12);
  const stem=10+p*(maxStem-10);
  const sx=potX, sy=potTop+2, tipX=sx+sway, tipY=sy-stem;
  ctx.strokeStyle=INKC; ctx.lineWidth=9;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(sx-4,sy-stem*0.5,tipX,tipY); ctx.stroke();
  ctx.strokeStyle='#4caf3a'; ctx.lineWidth=4.5;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(sx-4,sy-stem*0.5,tipX,tipY); ctx.stroke();
  const leaf=(fx,dir,size)=>{
    const lx=sx+(tipX-sx)*fx-2*fx, ly=sy-stem*fx;
    ctx.beginPath(); ctx.moveTo(lx,ly);
    ctx.quadraticCurveTo(lx+dir*size*0.6,ly-size*0.75,lx+dir*size,ly-size*0.15);
    ctx.quadraticCurveTo(lx+dir*size*0.5,ly+size*0.35,lx,ly);
    inkFill(dir<0?'#6ccf4a':'#8ee25c',2.5);
  };
  const ls=9+p*10;
  leaf(0.55,-1,ls); leaf(0.75,1,ls*0.9);
  if(p>0.45) leaf(0.35,1,ls*0.8);
  if(p>0.7) leaf(0.9,-1,ls*0.7);
  if(p>=1){
    const pulse=1+Math.sin(t*0.006)*0.06;
    for(let k=0;k<5;k++){ const a=k*1.2566+t*0.0008;
      ctx.beginPath(); ctx.ellipse(tipX+Math.cos(a)*7.5*pulse,tipY+Math.sin(a)*7.5*pulse,6.5,4.5,a,0,6.283); inkFill('#ff7eb6',2); }
    ctx.beginPath(); ctx.arc(tipX,tipY,5,0,6.283); inkFill('#ffd23f',2);
  } else { ctx.beginPath(); ctx.arc(tipX,tipY,4,0,6.283); inkFill('#8ee25c',2); }
  // pot
  const tw=52, bw=38;
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(potX,potBottom+3,30,5,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(potX-tw/2+3,potTop+7); ctx.lineTo(potX+tw/2-3,potTop+7); ctx.lineTo(potX+bw/2,potBottom); ctx.lineTo(potX-bw/2,potBottom); ctx.closePath();
  inkFill('#e0804e',3);
  roundRect(ctx,potX-tw/2,potTop,tw,11,5); inkFill('#f2985f',3);
  ctx.fillStyle=`rgb(${Math.round(120-60*p)},${Math.round(84-44*p)},${Math.round(52-24*p)})`;
  ctx.beginPath(); ctx.ellipse(potX,potTop+3,tw/2-6,2.5,0,0,6.283); ctx.fill();
  const blink=(Math.floor(t/2800)%3===0)&&(t%2800<130);
  const ey=potTop+20;
  ctx.fillStyle=INKC;
  if(blink){ ctx.fillRect(potX-11,ey-1,7,2.6); ctx.fillRect(potX+4,ey-1,7,2.6); }
  else { ctx.beginPath(); ctx.ellipse(potX-7.5,ey,3.2,4,0,0,6.283); ctx.ellipse(potX+7.5,ey,3.2,4,0,0,6.283); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(potX-6.4,ey-1.4,1.3,0,6.283); ctx.arc(potX+8.6,ey-1.4,1.3,0,6.283); ctx.fill(); }
  ctx.fillStyle='#ff9e8a'; ctx.beginPath(); ctx.arc(potX-14,ey+5,2.8,0,6.283); ctx.arc(potX+14,ey+5,2.8,0,6.283); ctx.fill();
  ctx.strokeStyle=INKC; ctx.fillStyle=INKC; ctx.lineWidth=2.4;
  const my=ey+8.5;
  if(flowing){ ctx.beginPath(); ctx.ellipse(potX,my,3.4,3.8,0,0,6.283); ctx.fill(); }
  else if(p>=0.5){ ctx.beginPath(); ctx.arc(potX,my-3,5.2,0.35,Math.PI-0.35); ctx.stroke(); }
  else if(p>=0.15){ ctx.beginPath(); ctx.moveTo(potX-4,my); ctx.lineTo(potX+4,my); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(potX,my+4,4.6,Math.PI+0.5,-0.5); ctx.stroke(); }
  ctx.restore();
}

function render(t){
  const {dpr,vw,vh,cell,ox,oy,fw,fh}=lay;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(bgC,0,0,vw,vh);
  if(!S) return;
  if(S.track.length){ for(const i of S.track) markT(i%W,(i/W)|0); S.track.length=0; }
  buildTerrain();
  if(shadowDirty) buildShadow();
  buildLiquid();
  // comic panel frame
  ctx.fillStyle=INKC; roundRect(ctx,ox-3,oy-3,fw+6,fh+6,9); ctx.fill();
  ctx.save(); roundRect(ctx,ox,oy,fw,fh,7); ctx.clip();
  ctx.drawImage(brickC,ox,oy,fw,fh);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(shadowC,ox+cell*0.45,oy+cell*0.7,fw,fh);
  ctx.drawImage(terrC,ox,oy,fw,fh);
  drawGates(t);
  for(const o of S.objs){ if(o.type==='switch') drawSwitch(o,t); else if(o.type==='pswitch') drawEater(o,t); }
  ctx.drawImage(liqC,ox,oy,fw,fh);
  for(const s of S.spouts) drawSpout(s,t);
  for(const o of S.objs) if(o.type==='bloom') drawBloom(o,t);
  for(const p of particles){
    const a=p.life/p.max, px=ox+p.x*cell, py=oy+p.y*cell;
    if(p.kind==='steam'){ ctx.fillStyle=`rgba(210,250,170,${a*0.6})`; ctx.beginPath(); ctx.arc(px,py,cell*(1.4-a*0.8),0,6.283); ctx.fill(); }
    else if(p.kind==='bubble'){ ctx.strokeStyle=`rgba(29,18,9,${a})`; ctx.fillStyle=`rgba(200,255,120,${a})`; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(px,py,cell*(0.9-a*0.35),0,6.283); ctx.fill(); ctx.stroke(); }
    else if(p.kind==='leaf'){ ctx.globalAlpha=a; ctx.beginPath(); ctx.ellipse(px,py,cell*0.55,cell*0.28,p.life*0.2,0,6.283); inkFill('#8ee25c',1.2); ctx.globalAlpha=1; }
    else if(p.kind==='crumb'){ ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(px,py,cell*0.4,0,6.283); inkFill(`rgb(${200+p.c*30},${120+p.c*20},60)`,1.2); ctx.globalAlpha=1; }
    else { ctx.globalAlpha=a; ctx.beginPath(); const r=cell*0.55*a+1.5;
      for(let k=0;k<10;k++){ const ang=k*Math.PI/5, rr=k%2?r*0.45:r; ctx.lineTo(px+Math.cos(ang)*rr,py+Math.sin(ang)*rr); }
      ctx.closePath(); inkFill('#ffd23f',1.2); ctx.globalAlpha=1; }
  }
  ctx.restore();
  drawPipeAndPip(t);
}

// ---------- Main loop ----------
let lastT=performance.now(), acc=0;
const STEP=1/120;
function loop(t){
  const dt=Math.min(0.1,(t-lastT)/1000); lastT=t;
  if(S&&state!=='menu'){
    acc+=dt; let n=0;
    while(acc>=STEP&&n<4){ simStep(S); acc-=STEP; n++; }
    if(n===4) acc=0;
    updateParticles(); updateMeter();
    if(state==='play'){
      if(S.poisonDrained>0) finish(false,'Gift ist in Pflanzis Leitung geflossen!');
      else if(S.drained>=L.required) finish(true);
      else if(S.drained+S.waterCount+spoutLeft(S)<L.required) finish(false,'Es ist nicht mehr genug sauberes Wasser übrig.');
      else {
        if(S.vMoves===0&&!pointerDown) idleFrames++; else idleFrames=0;
        $('#bRestart').classList.toggle('pulse',idleFrames>360);
      }
    } else if(state==='winning'){
      if(S.poisonDrained>0) finish(false,'Gift ist in Pflanzis Leitung geflossen!');
      else if(++winTimer>100) finish(true);
    }
  }
  render(t);
  requestAnimationFrame(loop);
}

// ---------- Menus ----------
function refreshMenu(){
  const n=Math.min(save.unlocked,LEVEL_COUNT);
  $('#playLbl').textContent=save.unlocked>LEVEL_COUNT?'Alle 200 geschafft!':'Level '+n+' · '+THEMES[worldOf(n)].name;
  $('#bSound').classList.toggle('off',!save.sound);
  $('#bMusic').classList.toggle('off',!save.music);
}
function goMenu(){ state='menu'; hud.classList.add('hidden'); refreshMenu(); show('menu'); musicVol(0.34); }

let page=0;
const LOCK='<svg viewBox="0 0 24 24" stroke="#1d1209" stroke-width="2.6" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="3" fill="#ffd23f"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none"/></svg>';
function renderLevels(){
  const grid=$('#lvGrid'); grid.innerHTML='';
  const total=Math.max(save.unlocked,1), th=THEMES[page];
  const start=page*WORLD_SIZE+1;
  $('#lvTitle').textContent=th.name;
  $('#lvSub').textContent='Welt '+(page+1)+' von '+THEMES.length+' · Level '+start+'–'+(start+WORLD_SIZE-1);
  $('#levels').style.setProperty('--wc',rgbs(th.brick));
  $('#levels').style.setProperty('--wd',rgbs(th.dirt));
  for(let n=start;n<start+WORLD_SIZE;n++){
    const b=document.createElement('button'); b.className='lv';
    const st=save.stars[n]||0;
    if(n>total) b.classList.add('locked');
    if(n===total) b.classList.add('cur');
    if(n>total) b.innerHTML=LOCK;
    else b.innerHTML=`${n}<span class="st">${'<i class="on"></i>'.repeat(st)}${'<i></i>'.repeat(3-st)}</span>`;
    b.onclick=()=>startLevel(levelMeta(n));
    grid.appendChild(b);
  }
  const stars=Object.values(save.stars).reduce((a,b)=>a+b,0);
  $('#lvTotal').innerHTML='<svg viewBox="-26 -26 52 52"><use href="#bloomG"/></svg>'+stars;
  $('#pgTxt').textContent=(page+1)+' / '+THEMES.length;
  $('#pgPrev').style.visibility=page>0?'visible':'hidden';
  $('#pgNext').style.visibility=page<THEMES.length-1?'visible':'hidden';
}

$('#bPlay').onclick=()=>{ if(save.unlocked>LEVEL_COUNT) startLevel(randomMeta()); else startLevel(levelMeta(save.unlocked)); };
$('#bLevels').onclick=()=>{ page=Math.min(THEMES.length-1,worldOf(Math.min(save.unlocked,LEVEL_COUNT))); renderLevels(); show('levels'); };
$('#bRandom').onclick=()=>startLevel(randomMeta());
$('#bSound').onclick=()=>{ save.sound=!save.sound; persist(); refreshMenu(); if(save.sound) sfx.bloom(); };
$('#bMusic').onclick=()=>{ save.music=!save.music; persist(); refreshMenu(); if(save.music) musicStart(); else musicStop(); };
$('#bLvBack').onclick=goMenu;
$('#pgPrev').onclick=()=>{ page=Math.max(0,page-1); renderLevels(); };
$('#pgNext').onclick=()=>{ page=Math.min(THEMES.length-1,page+1); renderLevels(); };
$('#bBack').onclick=goMenu;
$('#bRestart').onclick=restart;
$('#rRetry').onclick=restart;
$('#rMenu').onclick=goMenu;
$('#rNext').onclick=()=>{
  if(cur.random||cur.level>=LEVEL_COUNT) startLevel(randomMeta());
  else startLevel(levelMeta(cur.level+1));
};

document.querySelectorAll('[data-split]').forEach((el,k)=>{
  [...el.dataset.split].forEach((ch,i)=>{ const sp=document.createElement('span'); sp.className='ch'; sp.textContent=ch;
    sp.style.setProperty('--r',((i%2?1:-1)*(3+((i*7+k*3)%4)))+'deg'); sp.style.animationDelay=(-i*0.18-k*0.5)+'s'; el.appendChild(sp); });
});
refreshMenu(); layout(); requestAnimationFrame(loop);
$('#tapstart').addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); audioCtx(); if(save.music) musicStart(); $('#tapstart').remove(); });

if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
